<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isotone · product preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f6; }
    /* Capture at 1200 × 720. The iframe holds the live product; demo.css's
       data-capture treatment only touches the host page. */
    main { max-width: 1200px; margin: auto; padding: 32px; }
    .window { border: 1px solid #dcdce2; border-radius: 15px; overflow: hidden; background: #fff; box-shadow: 0 3px 0 #e6e6e9; }
    .window-bar { height: 32px; border-bottom: 1px solid #e7e7eb; display: flex; align-items: center; padding: 0 12px; gap: 5px; }
    .window-bar i { width: 5px; height: 5px; border-radius: 50%; background: #cfcfd6; }
    .window-bar span { font: 10px ui-sans-serif, system-ui, -apple-system, sans-serif; color: #8c8d98; margin: auto; padding-right: 22px; }
    iframe { display: block; width: 100%; height: 622px; border: 0; }
  </style>
</head>
<body>
  <main>
    <div class="window"><div class="window-bar"><i></i><i></i><i></i><span>localhost:5173</span></div><iframe title="Isotone in a running app" src="/?capture=light"></iframe></div>
  </main>
</body>
</html>
