<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isotone · product preview</title>
  <style>
    * { box-sizing: border-box; }
    /* Transparent around the window, so the README image has no frame of its own. */
    html, body { margin: 0; background: transparent; }
    /* Capture at the window size the scene sets (see development.md) with a
       device scale of 2. ?scene=focus|both|pin picks what the live demo shows;
       ?theme=light switches the page theme. */
    main { margin: 0; padding: 0; }
    .window { border: 1px solid #26272e; border-radius: 15px; overflow: hidden; background: #0d0e11; }
    .window-bar { height: 32px; border-bottom: 1px solid #282a31; display: flex; align-items: center; padding: 0 12px; gap: 5px; }
    .window-bar i { width: 5px; height: 5px; border-radius: 50%; background: #41434d; }
    .window-bar span { font: 10px ui-sans-serif, system-ui, -apple-system, sans-serif; color: #8c8d98; margin: auto; padding-right: 22px; }
    .light .window { border-color: #dcdce2; background: #fff; }
    .light .window-bar { border-color: #e7e7eb; }
    .light .window-bar i { background: #cfcfd6; }
    iframe { display: block; width: 100%; height: calc(100vh - 34px); border: 0; }
  </style>
</head>
<body>
  <main>
    <div class="window"><div class="window-bar"><i></i><i></i><i></i><span>localhost:5173</span></div><iframe title="Isotone in a running app"></iframe></div>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const theme = query.get('theme') === 'light' ? 'light' : 'dark';
    document.body.classList.toggle('light', theme === 'light');
    document.querySelector('iframe').src = `/?capture=${theme}&scene=${encodeURIComponent(query.get('scene') ?? 'focus')}`;
  </script>
</body>
</html>
