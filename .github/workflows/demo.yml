# Deploys the hosted demo (isotone.vercel.app) with the Vercel CLI: production
# for every commit on main, and a preview with its link in a comment for every
# pull request. Without the Vercel secrets (forks, or before they are set up)
# it skips with a notice instead of failing. Setup: docs/development.md#hosted-demo.
name: Demo

on:
  push:
    branches: [main]
  pull_request:
  # publish.yml dispatches this after its version commit, which, being pushed
  # with GITHUB_TOKEN, does not trigger the push event above.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deployment per pull request or branch; a newer commit replaces an older run.
  group: demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 65.2.0
  VERCEL_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the Vercel secrets
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice title=Demo not deployed::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are not available to this run (a fork, or not set up yet). See docs/development.md#hosted-demo.'
          fi

      - name: Choose production or preview
        id: target
        if: steps.vercel.outputs.ready == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ] && [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            echo 'environment=production' >> "$GITHUB_OUTPUT"
            echo 'prod=--prod' >> "$GITHUB_OUTPUT"
          else
            echo 'environment=preview' >> "$GITHUB_OUTPUT"
            echo 'prod=' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.vercel.outputs.ready == 'true'
        with:
          # Later steps run the project's scripts; keep the GitHub token out of .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: steps.vercel.outputs.ready == 'true'
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        if: steps.vercel.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.vercel.outputs.ready == 'true'
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
        if: steps.vercel.outputs.ready == 'true'

      # A dispatched run must still be at the tip of main, so an older commit
      # can never replace a newer production demo.
      - name: Check this is still main
        if: steps.target.outputs.environment == 'production'
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice title=Demo not deployed::main has moved on; the newer commit deploys instead.'
          fi

      # Only the steps that talk to Vercel get the token. The build runs the
      # project's own scripts, so it gets just the settings `vercel pull` saved
      # in .vercel/; `vercel build` needs no token once they exist.
      - name: Pull the Vercel project settings
        id: pull
        if: steps.target.outputs.environment == 'preview' || steps.current.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
        run: vercel pull --yes --environment="$ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.pull.outcome == 'success'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PROD: ${{ steps.target.outputs.prod }}
        # Runs vercel.json's buildCommand (pnpm build:demo) into .vercel/output.
        run: vercel build $PROD

      - name: Deploy
        id: deploy
        if: steps.pull.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          PROD: ${{ steps.target.outputs.prod }}
        run: |
          url=$(vercel deploy --prebuilt $PROD --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Demo ($ENVIRONMENT): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Link the preview from the pull request
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          marker='<!-- isotone-demo-preview -->'
          body="$marker
          **Demo preview:** $URL

          Built from ${HEAD_SHA:0:7} merged into \`$BASE_REF\`, the commit GitHub tests for this pull request. Open it on a phone to try this change; this comment updates on every push."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
