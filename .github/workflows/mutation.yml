name: Mutation testing

# Weekly, not per pull request: it reruns the tests once per mutant of the
# Node-side layers (stryker.config.json; the scripts are tested in child
# processes, which Stryker's per-test coverage cannot see). The run fails when
# the score drops below the config's `break`. Read the survivors in the
# uploaded report and add tests for the meaningful ones.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-latest
    # The first, full run takes hours; later runs reuse the cached incremental
    # file and retest only mutants whose code or tests changed.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental.json
          key: mutation-${{ github.run_id }}
          restore-keys: mutation-
      - run: pnpm mutate
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: reports/mutation/incremental.json
          key: mutation-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
