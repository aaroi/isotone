# Keep this filename: npm's trusted publisher is bound to publish.yml.
name: Publish main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      # This job pushes the version commit, so it keeps the checkout's token.
      # It installs nothing and runs only the repository's two release scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # zizmor: ignore[artipacked]
      - name: Check this is still main
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.ready == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Prepare the next version
        id: prepare
        if: steps.current.outputs.ready == 'true'
        run: |
          published=$(npm view isotone version)
          # Features or breaking notes under Unreleased need a raised minor: stop
          # here rather than publish them as a patch.
          node scripts/check-release.mjs "$published"
          node scripts/prepare-release.mjs "$published"
          git add package.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore: prepare Isotone $(node -p 'require("./package.json").version')"
            git push origin HEAD:main
            echo 'committed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the prepared main commit
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main

  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      unpublished: ${{ steps.version.outputs.unpublished }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      # The public repository fetches without a token, so none is left on disk
      # while dependencies install and tests run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the dispatch still points to main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "isotone@$version" version >/dev/null 2>&1; then
            echo 'unpublished=false' >> "$GITHUB_OUTPUT"
          else
            echo 'unpublished=true' >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:package
      # Pack before anything from outside the lockfile runs: the smoke job's
      # Vite, React and jsdom never touch this tree, and the publish job checks
      # it publishes exactly these bytes.
      - name: Pack
        id: pack
        run: |
          mkdir release && npm pack --ignore-scripts --pack-destination release
          echo "sha256=$(sha256sum release/*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.unpublished == 'true'
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: check
    if: needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Nothing publishes without the packed archive installing into fresh
      # apps on Vite 5 to 8 with React 18 and 19. Only the smoke script
      # comes from the checkout; nothing is installed into it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - run: node scripts/smoke.mjs release/*.tgz

  publish:
    needs: [check, smoke]
    if: needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - name: Check this is the archive the check job packed
        env:
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: echo "$SHA256  $(ls release/*.tgz)" | sha256sum --check
      - name: Check npm supports trusted publishing
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('npm 11.5.1 or newer is required for trusted publishing');
          }
          JS
      - run: npm publish ./release/*.tgz --ignore-scripts --provenance --access public

  release:
    needs: [check, smoke, publish]
    if: always() && needs.check.result == 'success' && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Tag the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [ "$PUBLISH_RESULT" = 'skipped' ]; then
            npm view "isotone@$VERSION" version >/dev/null
          fi
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Isotone $VERSION" --generate-notes
